<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DevFlow{% endblock %}</title>
    <meta
      name="description"
      content="DevFlow — a small Flask application used to demonstrate a GitHub Actions, Docker and Render delivery pipeline."
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2316150f'/><path d='M8 22V10h6.5M8 16h5' stroke='%23f7f6f2' stroke-width='2' fill='none'/></svg>"
    />
  </head>
  <body>
    <a class="skip" href="#main">skip to content</a>

    <header class="masthead">
      <div class="wrap masthead-row">
        <p class="wordmark">
          <a href="{{ url_for('main.index') }}">DevFlow</a>
          <span class="slash">/</span> ci/cd demo
        </p>
        <nav class="nav" aria-label="Page sections">
          <a href="#pipeline">pipeline</a>
          <a href="#api">api</a>
          <button id="theme-toggle" class="theme" type="button" aria-pressed="false">
            <span class="theme-label">theme: light</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <div class="wrap footer-row">
        <p>devflow v{{ version }} · {{ environment }} · flask + gunicorn + docker</p>
        <p class="note">build results live in GitHub Actions; this page describes configuration only.</p>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>
