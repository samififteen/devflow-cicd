name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (but never a run on main mid-flight).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag devflow:ci .

      - name: Smoke test the image
        run: |
          docker run --detach --name devflow-ci --publish 8000:8000 --env APP_ENV=production devflow:ci
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo
              echo "Health endpoint answered on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy in time."
          docker logs devflow-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs devflow-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force devflow-ci
